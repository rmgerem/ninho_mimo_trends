# ============================================================
# docker-compose.yml — Ninho & Mimo Trends (Producao)
#
# Sobe 3 servicos:
#   postgres   — banco de dados
#   scheduler  — coleta automatica em loop continuo
#   grafana    — dashboard do cliente
#
# Uso:
#   cp .env.docker .env.docker.local   # edite com suas credenciais reais
#   docker compose --env-file .env.docker.local up -d
#   docker compose logs -f scheduler   # acompanhe as coletas
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # PostgreSQL — banco de dados principal
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nmt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ninho_mimo_trends}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Porta externa para pgAdmin; internamente os servicos usam postgres:5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ninho_mimo_trends}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nmt_network

  # ----------------------------------------------------------
  # Migrations — aplica o schema antes do scheduler iniciar
  # Roda uma vez e sai (restart: "no")
  # ----------------------------------------------------------
  migrations:
    build: .
    container_name: nmt_migrations
    restart: "no"
    command: ["database", "upgrade"]
    env_file: .env.docker.local
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nmt_network

  # ----------------------------------------------------------
  # Seed — popula categorias/fontes na primeira vez
  # Roda uma vez e sai (restart: "no")
  # ----------------------------------------------------------
  seed:
    build: .
    container_name: nmt_seed
    restart: "no"
    command: ["seed"]
    env_file: .env.docker.local
    environment:
      DB_HOST: postgres
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - nmt_network

  # ----------------------------------------------------------
  # Scheduler — coleta automatica em loop continuo
  # Reinicia sempre que cair (ex.: erro de rede temporario)
  # ----------------------------------------------------------
  scheduler:
    build: .
    container_name: nmt_scheduler
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ninho-mimo-trends database check; do
          echo "PostgreSQL ainda indisponivel; nova tentativa em 5 segundos..."
          sleep 5
        done
        exec ninho-mimo-trends scheduler start
    env_file: .env.docker.local
    environment:
      DB_HOST: postgres
      APP_ENV: PROD
      LOG_LEVEL: INFO
      PROMETHEUS_PUSHGATEWAY_URL: http://pushgateway:9091
    depends_on:
      seed:
        condition: service_completed_successfully
      pushgateway:
        condition: service_started
    networks:
      - nmt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------
  # Pushgateway — recebe metricas push do scheduler
  # ----------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:latest
    container_name: nmt_pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - nmt_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ----------------------------------------------------------
  # Prometheus — scrape do Pushgateway; datasource no Grafana
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nmt_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - pushgateway
    networks:
      - nmt_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ----------------------------------------------------------
  # Web — Roteador dinamico de links
  # ----------------------------------------------------------
  web:
    build: .
    container_name: nmt_web
    restart: unless-stopped
    entrypoint: ["uvicorn"]
    command: ["ninho_mimo_trends.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.docker.local
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nmt_network

  # ----------------------------------------------------------
  # Grafana — dashboard do cliente
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: nmt_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Credenciais do admin do Grafana (altere em producao!)
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      # Senha do banco para o data source provisionado
      GF_NMT_DB_HOST: postgres
      GF_NMT_DB_PASSWORD: ${DB_PASSWORD}
      # Desabilita registro anonimo (producao)
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Permite apenas login local (sem convites externos)
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nmt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:

networks:
  nmt_network:
    driver: bridge
