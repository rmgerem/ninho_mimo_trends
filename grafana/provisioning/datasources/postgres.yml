apiVersion: 1

# Provisionamento automatico do data source PostgreSQL.
# Este arquivo funciona tanto em modo local (localhost) quanto via Docker
# (host = 'postgres', nome do servico no docker-compose.yml).
#
# A senha e lida da variavel de ambiente GF_NMT_DB_PASSWORD, que e
# passada ao container Grafana pelo docker-compose.yml ou pelo sistema
# operacional — nunca escreva a senha real neste arquivo.
datasources:
  - name: PostgreSQL - ninho_mimo_trends
    type: postgres
    uid: ninho-mimo-trends-postgres
    # Em Docker: usa o nome do servico. Em local: troque por localhost.
    url: ${GF_NMT_DB_HOST:-postgres}:5432
    database: ninho_mimo_trends
    user: postgres
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GF_NMT_DB_PASSWORD}
