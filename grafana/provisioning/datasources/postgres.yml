apiVersion: 1

# Provisionamento automatico do data source PostgreSQL usado pelo dashboard
# "Ninho & Mimo Trends — Indicacoes da Automacao". Copie este arquivo para o
# diretorio de provisionamento do seu Grafana (ver docs/grafana.md) ou importe
# o data source manualmente com os mesmos parametros pela UI.
#
# IMPORTANTE: a senha abaixo usa uma variavel de ambiente do processo do
# Grafana (GF_NMT_DB_PASSWORD) - nunca coloque a senha real neste arquivo.
datasources:
  - name: PostgreSQL - ninho_mimo_trends
    type: postgres
    uid: ninho-mimo-trends-postgres
    url: localhost:5432
    database: ninho_mimo_trends
    user: postgres
    isDefault: false
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GF_NMT_DB_PASSWORD}
