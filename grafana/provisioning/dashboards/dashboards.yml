apiVersion: 1

# Provisionamento automatico do dashboard "Ninho & Mimo Trends — Indicacoes da
# Automacao". Copie este arquivo para o diretorio de provisionamento de
# dashboards do seu Grafana (ver docs/grafana.md) para que o dashboard seja
# carregado automaticamente ao iniciar o servidor, ou importe o JSON
# manualmente pela UI (Dashboards > New > Import).
providers:
  - name: ninho-mimo-trends
    orgId: 1
    folder: "Ninho & Mimo Trends"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
