[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninho_mimo_trends"
version = "0.1.0"
description = "Ninho & Mimo - Plataforma de inteligencia de produtos para gestantes, maes, bebes e criancas ate 10 anos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ninho & Mimo" }]
keywords = ["produtos", "tendencias", "gestantes", "bebes", "criancas", "e-commerce"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "rapidfuzz>=3.6,<4.0",
    "prometheus-client>=0.20,<1.0",
    "pytrends>=4.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "black>=24.3,<25.0",
    "mypy>=1.9,<2.0",
    "types-requests",
    "factory-boy>=3.3,<4.0",
]

[project.scripts]
ninho-mimo-trends = "ninho_mimo_trends.cli.parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ninho_mimo_trends" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ninho_mimo_trends"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/ninho_mimo_trends"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
